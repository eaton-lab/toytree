<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430">
<rect width="100%" height="100%" fill="white"/>
<style>text{font-family:Helvetica,Arial,sans-serif;fill:#263238}.title{font-size:19px;font-weight:700}.label{font-size:14px}.tick,.legend{font-size:12px}</style>
<text class="title" x="20" y="28">Convergence in the V17 confirmation benchmark</text>
<line x1="210.0" y1="50" x2="210.0" y2="375" stroke="#e0e0e0"/>
<text class="tick" x="210.0" y="397" text-anchor="middle">0%</text>
<line x1="341.0" y1="50" x2="341.0" y2="375" stroke="#e0e0e0"/>
<text class="tick" x="341.0" y="397" text-anchor="middle">20%</text>
<line x1="472.0" y1="50" x2="472.0" y2="375" stroke="#e0e0e0"/>
<text class="tick" x="472.0" y="397" text-anchor="middle">40%</text>
<line x1="603.0" y1="50" x2="603.0" y2="375" stroke="#e0e0e0"/>
<text class="tick" x="603.0" y="397" text-anchor="middle">60%</text>
<line x1="734.0" y1="50" x2="734.0" y2="375" stroke="#e0e0e0"/>
<text class="tick" x="734.0" y="397" text-anchor="middle">80%</text>
<line x1="865.0" y1="50" x2="865.0" y2="375" stroke="#e0e0e0"/>
<text class="tick" x="865.0" y="397" text-anchor="middle">100%</text>
<text class="label" x="198" y="86.7" text-anchor="end">Strict clock</text>
<rect x="210" y="66.7" width="653.6" height="12" rx="2" fill="#1565c0"/>
<rect x="210" y="84.7" width="373.9" height="12" rx="2" fill="#ef6c00"/>
<text class="label" x="198" y="140.0" text-anchor="end">Discrete K=2</text>
<rect x="210" y="120.0" width="655.0" height="12" rx="2" fill="#1565c0"/>
<rect x="210" y="138.0" width="353.4" height="12" rx="2" fill="#ef6c00"/>
<text class="label" x="198" y="193.3" text-anchor="end">Discrete K=3</text>
<rect x="210" y="173.3" width="655.0" height="12" rx="2" fill="#1565c0"/>
<rect x="210" y="191.3" width="343.9" height="12" rx="2" fill="#ef6c00"/>
<text class="label" x="198" y="246.7" text-anchor="end">Correlated</text>
<rect x="210" y="226.7" width="655.0" height="12" rx="2" fill="#1565c0"/>
<rect x="210" y="244.7" width="229.2" height="12" rx="2" fill="#ef6c00"/>
<text class="label" x="198" y="300.0" text-anchor="end">Relaxed (chronos)</text>
<rect x="210" y="280.0" width="612.7" height="12" rx="2" fill="#1565c0"/>
<rect x="210" y="298.0" width="466.7" height="12" rx="2" fill="#ef6c00"/>
<text class="label" x="198" y="353.3" text-anchor="end">UCLN</text>
<rect x="210" y="333.3" width="655.0" height="12" rx="2" fill="#1565c0"/>
<rect x="210" y="410" width="14" height="10" fill="#1565c0"/><text class="legend" x="230" y="419">ToyTree</text>
<rect x="310" y="410" width="14" height="10" fill="#ef6c00"/><text class="legend" x="330" y="419">ape::chronos</text>
</svg>
